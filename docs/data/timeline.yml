# 출처: 이우교육공동체 20년사_Part4_연대표.docx / .pdf (통합편집본)
# 마지막 갱신: 2026-08-23
#
# 스키마: year, month, day(선택, 정확한 일자가 있는 경우), event, anchor(YYYY-MM,
#         일자 불명 시 YYYY, 동일 월 다건 시 YYYY-MM-N), related_essays(Plan 3에서 채움)
#
# 비고: 원문 날짜란이 기간(~)으로 표기된 사건은 anchor를 시작 시점으로 고정하고,
# event 앞에 [원문 날짜] 를 그대로 보존해 정보 손실을 막았다. 본문 서술은 원문 표현을
# 그대로 유지했으며, 동일 표현이 문서 내 다른 곳과 명백히 어긋나는 오탈자 1건
# (2002.3.2 '이우학교원' → '이우학원')만 교정했다.
#
# [기간] 프리픽스 컨벤션: event 값이 "[○월 ○일 ~ ○월 ○일]" 형태로 시작하는 항목은
# 원문에 기간으로 표기된 사건이며, 현재 총 12건이다 (예: '[9월 8일 ~ 10월 23일] ...').
# 이 항목들의 anchor는 모두 기간의 시작 시점 기준으로 고정되어 있다.
#
# 편찬위 확정 필요: 2004년 10월 '이우교육연구소 설립 의결' 항목(anchor: 2004-10)은
# 날짜순 정렬 원칙에 따라 배치했다. 원문에서는 이 항목이 인접한 9월 8~10일 관련
# 항목들 뒤(서술상 순서)에 등장하지만, 정확한 일자가 없어 월 단위로만 anchor를
# 부여했다. 원문 서술 순서를 그대로 유지할지, 현재의 날짜순 배치를 유지할지는
# 편찬위원회 확정이 필요하다 (관련 GitHub Issue 참고).

- year: 2001
  month: 1
  event: 1997년 11월부터 성남지역에 대안학교를 설립하자는 취지에서 매주 1차례씩 모여 대안교육에 관한 세미나를 하고 현장 탐방을 하던 사람들이 (가칭) ‘내일을 여는 학교 준비모임’ 결성. 공교육의 혁신을 촉진하고 이끌어낼 수 있는 도시형 대안학교의 모델을 세우자는 데 뜻을 모음. 정광필을 대표로 선출. 한국교육개발원 회의실에서 ‘도시형 대안학교 설립을 위한 워크숍’ 개최. 이종태 한국교육개발원 연구원, 정유성 서강대 교수, 이재갑 교육부 서기관, 정기준 푸른꿈고등학교 교사 등이 참석하여 학교 설립과 관련된 각종 문제들에 대해 자문을 함
  anchor: 2001-01
  related_essays: []

- year: 2001
  month: 7
  day: 1
  event: 경기도 광주시 남한산성에 위치한 만해기념관에서 (가칭) ‘내일을 여는 학교 설립추진위원회’ 결성 총회 개최 △규약 제정 △이종태, 정광필, 하동근을 공동대표로 선출 △사업계획안 심의‧의결 △학교명을 신영복 선생이 지어주신 ‘이우학교’로 결정. 그 결과 (가칭) ‘내일을 위한 학교 설립추진위원회’의 명칭도 이우학교 설립추진위원회로 변경. 당시 설립추진위원은 32명
  anchor: 2001-07
  related_essays: []

- year: 2001
  month: 10
  day: 23
  event: 성남시 분당구 동원동 산13-1의 자리를 학교 부지로 계약. 이 자리를 계약하기 전 3년간 100군데 정도 물색. 최종적으로 분당구 율동 새마을 연수원 뒤쪽과 이 자리를 놓고 고심했으나 이 자리가 학교 부지로 적합하다고 판단해 결정
  anchor: 2001-10-1
  related_essays: []

- year: 2001
  month: 10
  day: 28
  event: 이우학교설립추진위원회 제3차 운영위원회 개최 △학교 설립 주체를 교육협동조합의 형식으로 모집한다는 방침에서 100명의 뜻있는 설립자를 모집한다는 방침으로 수정 △ 당면 조직 사업의 목표는 이우학교 설립 추진위원회를 확대하기 △조합원 모집을 위한 설명회가 아니라 (가제)‘도시형 대안학교의 필요성과 그 모델’에 관한 워크숍을 개최하기 등을 의결
  anchor: 2001-10-2
  related_essays: []

- year: 2001
  month: 11
  event: 고인룡, 박성호, 박훈영, 신규식, 홍인표 등으로 학교 건축위원회 구성. 2001년 가을에 만들어진 이우학교의 건축 원칙(1. 주어진 자연환경 최대한 보존 2. 최대한 자연 에너지 사용 3. 집중적 건축방식 지양 4. 재활용 가능한 소재 활용)에 따라 건축설계안 공모. 건축위원회는 공모에 참여한 3팀 중에서 경영위치가 낸 설계안 선정. 건축위원회는 도시계획시설 결정을 위한 토목설계를 유아컨설팅에 발주
  anchor: 2001-11-1
