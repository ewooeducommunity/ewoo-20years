- year: 2022
  month: 3
  day: 27
  event: 공동체 정기총회 개최(15시, 사다리), 장지혜 대표의 개회 선언에 이어 △기관운영보고 1) 이우학교 2) 학교법인 3) 사다리- 디자인 교육사업, 청년협동조합180지원(운영위원으로 참여, 200만원 출자), 청년/청소년 인턴십 프로그램, 수익사업(디자인 외주 제작 사업) △감사보고(김인출) △의안 심의 1) 2021년 사업보고 및 2022년 사업계획 승인 ①조직위- 신입회원 6가구 영입, 비대면 북토크 시행, 메타버스 신년회 개최, 머내마을 영화제 함께 즐기기 이벤트, 회비 관리 등 ②지역위- 낙생지구 개발에 대한 이우학부모 대책위 구성 및 참여, 협동조합 180 조합원 확대사업 참여, 동천넷 활동 참여(고기공원 고고고 참여, 동천넷 마을여행 참여, 동천넷 운영위 참여), 마을여행을 알아서 좋았다. 여러공간에서 마을에 애정을 가지고 활동하고 살아가는 분들을 많이 만나니 이우학부모가 마을에 관심이 부족해 보였다. 마을이 이우에 교육공간으로 작동하기 시작한 것 같다. 따뜻하고 안전한 마을로 세상에 이런 데가 없는 것 같다. 낙생지구개발 사업에 대한 대책활동은 지역위에서 의제를 제안하고 학부모회가 대책위를 구성해서 활동하고 있다. 학부모 대책위는 학교 주변 교통안전을 주로 다루었고 아름방송에도 나갔다. 이 대책 활동은 지역위 고유 의제를 발굴하고 사업으로 성장시켜 나가는 계기를 마련하였다. 위원회 참여인원은 적었지만 정체성을 구축하면서 좀더 많은 인원이 참여할 수 있는 계기를 마련되어 후반기에는 획기적으로 회원이 확대(9명-신입 2명 포함하여)되었다. ③진로위- 책읽기 팀 1권 진행(말랑말랑한 노동을 위하여[황세원]), 진로위와 '함께 한끼' 1회 진행(김진원샘, 안정민샘, 임수경샘-2021.02월), 코로나로 인하여 추가 진행은 없었음. 시니어 창업팀 오프라인 모임 진행 7회, 아이디어 1건 발굴 ④교육위- 2020 종합평가 후속 활동으로 세 번의 집담회 운영하며 이우학교 발전을 위한 실천방향을 모색함. <천연균에서 찾은 오래된 미래> 독서토론 시행, 오랜 기간 필요성이 요구되어 방향을 모색하려 했으나 진행 못하다가 21년 이현영, 장지혜, 이희란님이 준비팀을 꾸려 공동체 역사정리 사업을 실질적으로 추진하게 됨 2) 2021년 결산 및 2022년 예산 승인- 이우교육공동체 역사편찬 사업 및 예산 결의 3) 학교법인 이사 및 감사 추천 4) 공동체 임원(위원장) 선출- 조직위 정대령, 진로위 허당
