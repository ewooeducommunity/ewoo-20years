  event: 공동체 운영위 개최 △협동조합 사다리- Space# 개소식(5/21), 50여명 참석, 부조금 수입 97만원 △조직위- 이우교육공동체에 참여한다는 것에 대해 자유 토론, 브런치 첫번째 모임 준비 △교육위- 2015년 교육연구위원회 사업 평가 및 2016년 계획, 교육위는 현재 4명으로 운영중인데 특히 교사 회원의 지속적인 충원이 필요함. 교육위의 주된 미션은 (한국, 세계) 교육의 흐름을 이해하고 비전을 모색하는 것과 이우학교의 교육적 이슈에 대하여 논의하는 것임. 이러한 미션은 내-외부 전문가들과의 네트워킹, 이우교육공동체 회원들의 관심과 논의를 통하여 진행함 △지역위- 2기 신입회원의 입장에서 봤을 때 공동체의 역할이나 지역위의 역할에 대한 개념이 명확치 않고 회원에 대한 정체성을 어떻게 가져야할지 모르겠다. 진로위나 지역위는 사업이 유동적이어서 역할에 대한 구체적인 개념잡기가 어려울 수 있다. 하지만 새로운 2기 공동체의 새로운 색깔을 입힐 수 있는 다양한 사업을 구상할 수 있다는 장점도 가지고 있다. 지역위라는 이름의 틀에 갇히지 말고 새로운 걸 제안하는 것이 필요하다. 기존 회원을 포함하여 같은 신입회원 사이에서도 거리감이 느껴지고 관계가 서먹하다. 기존회원들과 또는 신입회원들간의 만남의 자리가 있어야 할 것 같다. 기존 회원들은 부채문제로 인해 동력이 소진된 상태여서 공동체 활동에 소극적이 되어 지금은 관망하는 상태이며, 공동체 성격 자체가 시급하게 꼭 해야 할 일이 있는 것도 아니어서 참여율이 적은 것 같다. 일단은 한 달에 한 번 있는 위원회별 모임에 많은 회원들이 참여하게 하는 것이 중요하다. 1기가 학교를 세우고 발전시키는데 중점을 두었다면, 2기는 학교비전과 관련하여 학교가 지역으로 나가는 것에 방향성을 두고 사업을 구상하여야 할 것 같다. 현재 진로네트워크 구축하는 일을 학부모회와 공동체가 함께 하자는 논의가 되고 있다. 또한, 구체적이고 실질적으로 청년들이 사업을 시작할 수 있는 여건을 만들어 주는 것이 필요하다. △재정위- 현재 순수회비 계좌잔액 중 2천만원을 특별회계로 이전해서 부채상환하는 것을 운영위 차원에서 결정함. 회비관리를 앞으로 조직위에서 하기로 함 △학부모 회원 영입 원칙 토의- 비공개 원칙에는 원칙적으로 합의, 활동회원 기준 100가구 정도를 목표로 꾸준히 연 5~6명 정도 영입하자 △회원 참여 활성화를 위한 방안 토의- 비전 공유가 잘 안되고 있는 것에 대한 요청이 있어 전체 학부모들을 대상으로 한 ‘비전설명회’를 열기로 함
  anchor: 2016-06-1
