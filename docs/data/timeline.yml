- year: 2003
  month: 6
  event: '[6월 ~ 12월] 학교 도서관·식당·매점 운영의 틀 짜기. 2003년 6월 김혜영(공동체 부대표)과 김철원(국어교사)이 기획팀을 구성해 도서관 운영안을 마련하고, 공동체 회원 이희란 등이 주축이 된 실무팀이 도서 및 서가 구입. 2003년 7월 4일 이우교육공동체, 학교법인, 교사대표 연석회의는 향후 급식과 관련해 ① 친환경농산물을 식재료로 사용하고 음식물 찌꺼기는 퇴비로 사용한다 ② 쌀은 농촌 마을과 직거래하고 기타 식자재는 지역 공동체 조직과 협약하여 납품받는다는 등의 원칙을 세움. 매점과 관련해서는 이우생협을 조직해 운영한다는 원칙을 세우고 김용우 등이 주축이 돼 생협 창립 준비작업을 함'
