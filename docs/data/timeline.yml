- year: 2020
  month: 5
  day: 24
  event: 공동체 총회 개최(동천, 4시~5시), 장지혜 대표의 성원보고 및 개회선언에 이어 △기관운영 보고(이우학교/학교법인/사다리) △감사 보고 △의안심의 1) 2019년 사업보고 및 2020년 사업계획 승인 2) 2019년 결산 및 2020년 예산 승인 3) 학교법인 이사 및 감사 추천 4) 공동체 임원(위원장) 선출 5) 기타 안건 順으로 진행 △공동체 2019년 평가- 이우학교 리더십의 한축으로 공동체가 자리잡기 시작하였다. 빚으로부터 거의 탈출한 원년이자 회원과 회비구조, 내부 담론 형성 등이 안정화되기 시작하였다. 자기 역할을 해왔던 조직위와 더불어 교육위, 진로위가 자리잡기 시작 하였다. 교육위는 인원이 확충되고, ‘이우학교 평가’을 준비하면서 함께 해온 학습과 토 론을 통해 이우학교 운영과 교육과정에 대한 이해를 높여왔다. 진로위는 팀원이 확장되고 팀원간의 유대가 높아져 20년도 사업이 기대되는 위윈회가 되었다. 이사회 또한 활동하는 이사회로서 자리잡아 가고 있다. 이사들은 활동을 통해 이우학교의 제반 상황에 대한 이해를 높여 이사회가 이우정체성과 비전, 지속가능성의 방향을 잡아갈 수 있는 역량을 다져가고 있다. 지난 몇 년간의 지속적인 노력과 올해 특히 이사장님의 적극적인 활동으로 존재감 있는 이사회로서 좀 더 나아갔다. △공동체 2020년 계획- 공동체와 교사의 협력을 강화하기 위하여 교사신입회원의 영입을 현실화 해야 한다. 1기 공동체에서 교사는 공동체의 가장 중요한 멤버이자 리더십이었다. 새로운 교사 신입회원이 1기 교사 회원처럼 성장하기까지는 내부의 지속적인 도움과 교육이 필요할 수 있다. 익숙하고 편한 관계가 되기까지 학부모 회원들의 보다 세심한 배려가 요청 된다. 마을에 내려오는 교사들, 동천마을 네크워크 가입 등을 통해 지역 활동이 좀 더 활성화할 계기 마련되지만 한편으로는 지역위 내부 역량이 부족하여 어려움이 예상된다. 내년이 임기가 만료되는 이사가 4명(장지혜, 김광유/성평제, 홍금순- 개방이사), 감사가 1명(전창배) 교체될 예정이다. 활동하는 이사회의 역할 강화를 위하여 예상되는 이사회 내 활동분야는 재정/환경/학부모 교육/아이티(홈피, 아카이브, 유투브)이며, 이에 적절한 이사를 추천한다. 이우학교가 추구하는 정체성과 비전이 무엇이며, 어느 정도 실현되고 있는지를 평가할 올해 학교평가를 맞이하여, 이러한 과제를 지속적으로 이어갈 이우교육공동체의 역할을 환기하고 재정립한다.
  anchor: 2020-05-2
  related_essays: []

