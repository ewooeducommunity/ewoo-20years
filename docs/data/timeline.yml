  event: '이우교육공동체 정기총회 개최(오후 2시, 이우학교 대강의실), 신명철 대표의 개회선언으로 △2012년도 운영 보고(이우학교, 학교법인, 함께여는 교육연구소) △협동조합 더불어 마을 경과보고 △공동체 운영보고 △민재기 부대표의 결산보고 및 통과 △이사진 및 운영진 선출(임기만료 학교법인이사 이은경, 이상호, 김혜장, 신상열 후임으로 윤덕호, 배삼희, 이희란, 민순기를 선임하고 박명규 감사 후임으로는 김인현을 선임하며 이수광 이사는 중임하는 것으로 의결함. 공동체 신임 분회장으로는 김영묵(아름), 김광범(이과수), 배인정(용금성)을 선출하였고, 조직발전특별위원회 발족과 김광범, 김인현, 김희경, 박미선, 박형영, 이희란, 장지혜(가나다순)을 위원으로 선출하였음을 보고함 △조직 발전 특위 운영 의결- 운영 기간: 2013.4.28.~2013.12.1. 구성: 총회에서 특위 구성을 의결, 의제 공동체의 역할 정립, 현안에 능동적 대처 가능한 조직형태 개편안 제시, 재정문제 해결방안 강구, 활동시한 6개월가량 (2013년 5월~12월 임시총회까지), 구성원 김광범, 김인현, 김희경, 박미선, 박형영, 이희란, 장지혜(가나다순) △이우학교 10년에 대한 다양한 논의와 평가를 준비하고 총체적 결과물로 ’이우 10년사‘를 발간하기로 함. 세부적으로는 모두가 함께 어우러지는 10주년을 준비하기 위해 이우학교 ’10년사 소위‘, 이우 한마당(축제 소위), 이우인이 함께 부를 수 있는 노래를 만들기 위한 노래 제작 소위, 이우 10년을 돌아보고 재평가하는 학교 자체평가 소위 등을 구성키로함. 그 밖에 학교재정자립을 위한 시스템 확립을 고민하기로 하였으며 10주년을 디딤돌 삼아 새로운 이우의 도약에 뜻을 모았음'
  anchor: 2013-04-2
