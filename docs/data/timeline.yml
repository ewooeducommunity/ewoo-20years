  event: 공동체 정기총회 개최(이우학교 더불어관 대강의실) 박형영 대표의 개회선언 이후 △기관 운영보고 1) 이우학교- 새로운 중학교 입시 제도의 성공적 도입, 더불어학습관 신축, 하늘마루, 들마루 수리, 목송실, 도예실, 옷방 등 교육 공간 재구성, 교육과정 Framework에 근거한 연간 교육과정 운영, 학생 자치의 새로운 가능성(학생회 활동, 시국선언과 촛불 참여 등), 학교 브로우셔 제작, 홈페이지 재구성 2) 학교법인 이사회- 학습관을 비롯한 공간 재구성 사업 비용 마련을 위한 재정사업, 새 비전 확정 및 비전 관리, 교직원 인사, 예결산 의결 등 학교 운영을 위한 의사결정, 각 단위와의 협의와 소통을 통한 협치 3)함께여는교육연구소- 한국형 에프터 스콜레 ‘열일곱 인생학교’ 1기 운영, 고교 교육과정 다양화·특성화 및 체제 개편에 관한 방안 연구(세종시 교육청), 고교 교육과정 다양화?특성화 및 체제개편에 관한 교육주체 인식 조사 연구 (세종특별자치시 교육청), <시골빵집에서 자본론을 굽다>의 저자 ‘와타나베 이타루’ 작가님 무료강연 진행, 학부모 강연 진행(2016년 10월 2회 진행), 마을 교육 포럼 진행 (16년 11월, 17년 1월 2회, 파지스쿨과 공동 주최) 4)사회적협동조합 사다리- 인큐베이팅 공간(Space#) 조성 및 운영, 동천마을 네트워크 참여, 청년네트워크(주 1회 모임, 회당 5~6명 참석), 따복공동체 협동화사업 “마을교육생태계 실험 프로젝트(우리동네 모두학교)” 참여, 창업 지원(1인미디어 사업, 꿈지락 협동조합 등) △신입회원 소개 △감사 보고(전창배) △조직위 사업평가- 회원들간의 유대와 참여의식을 높이는 사업으로 브런치와 송년회를 기획하고 운영하여 일이 아니어도 공동체원들이 함께 모일 수 있는 장을 마련하였다. 재미없고 책임감으로 자리를 메꾸던 공동체의 문화에 약간의 변화를 모색하였다 △지역위- 졸업 학부모 주소록 재정비 작업이 이우가족, 큰 의미로서의 이우공동체가 와해되지 않도록 잡아 주는 역할을 한 것이 큰 의미가 있다고 보여지고, 학교를 다닐 동안만 이우가족이 아니라 졸업하고 나서도 계속 이우가족이라는 마음을 지닐 수 있도록 공동체가 끈이 되어서 이우라는 큰 울타리를 만들고 묶어주는 역할을 해야한다고 본다 △진로위- 모두학교와 방과 후 등 사다리 협동조합의 활동과 연계한 사업 등을 제외 하고는 고유한 고유사업을 진행하는데 미흡하였다. 모임 또한 비정기적인 적은 빈도로 개최되어 진로위 내부의 원활한 소통에도 적극적이지 진척하지 못한 면이 있었다. 전년도 학습모임과 같은 구체적인 내용과 이에 따른 모임 진행이 이루어졌던 것과 비교된다. 후반기 들어서 비교적으로 정기적 모임진행이 이뤄졌으나 많은 참여가 이뤄지진 못하였다. “1인미디어 ”라는 주제로 모두학교, 방과후 각 10차시로 총 20차시 이상을 진행 하였다. 지역의 다양한 연령대와 경험을 가진 수강생들이 참여하였고 방과 후의 경우 평균적으로 고른 참여도로 비교적 긍정적인 평가를 내릴 요소가 있었다 △교육위- 교육연구위의 주된 미션을 “(한국과 세계) 교육의 흐름을 이해하고 비전을 모색하는 것과 이우학교의 교육적 이슈에 대하여 논의하는 것”으로 설정하였음. 이러한 미션은 내-외부의 전문가들과의 네트워킹, 이우교육공동체 회원들의 관심과 논의를 통하여 진행함. 부정기적인 공개 세미나와 자체 세미나 등을 진행하기로 하였으나, 홍보 등 진행 미비로 공개 세미나는 제대로 진행되지 못한 측면도 있음. 신임이사 워크숍을 기획, 준비하여 진행하였고, 긍정적 평가를 받음 2016년 결산 및 2017년 예산 승인 (이상원) △2016년 결산 및 2017년 예산 승인 △학교법인 이사 추천- 이영희, 배은숙 △공동체 임원 선출- 교육위원장 한승수, 재정/조직/진로위원장은 유임
  anchor: 2017-04-1
