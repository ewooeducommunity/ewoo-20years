  event: 공동체 정기총회 개최(15시, 사다리), 장지혜 대표의 개회 선언 이후 △기관운영 보고 1)학교- 2023년 이우학교 운영방향 및 과제 2)학교 법인 3)사다리- 디자인 교육사업(청년디자인학교 4기, 실무자를 위한 디자인학교, 청년협동조합180 지원), 인턴십 프로그램(청소년 인턴 이우고 2명 디자인 인턴십 진행), 수익사업(디자인 외주 제작 사업) △감사 보고(김인출) △의안 심의 1) 2022년 사업보고 및 2023년 사업계획 승인 ①조직위 평가- 신입회원 영입 8가구로 계획 대비 초과 달성하였으나, 활발한 위원회 활동 참여를 위한 공동체 차원의 가이드는 다소 부족하였고, 위원회별 편중 현상은 개선 필요함. 각 위원회별 활동은 공동체 정식 가입 이후에 참여할 수 있도록 안내 필요함, 코로나로 인해 활동이 위축된 상황에서 오프라인 모임을 통해 일상을 회복할 수 있도록 브런치를 활성화하여 총3회 시행하였음, 신년회(1/8, 40여명 참석)의 경우 정성스런 테이블보와 아나바다 선물 준비, 즉석 사진 등 아이디어도 좋았지만, 참석한 모든 회원이 각자 잊지 않고 선물을 준비해 온 것이 고무적임. 한 분씩 선물을 교환하며 서로 인사 나눌 수 있는 시간이 특히 좋았고, 신년회 음식을 16기가 주축이 되어 준비한 것은 특히 의미 있었음 ②지역위 평가- 3회의 지역 탐방을 통해 대안적인 삶과 성장을 고민하고, 교육과 연계되어 성장해오는 마을 사례를 보며 동천마을의 마을교육공동체로서의 성장 모델에 대해 고민해 보는 계기가 되었다. 탐방내용 정리를 통해 동천동 성장모델에 대한 내부정리와 공동체 전체로의 공유를 준비하였으나 하반기에 회의가 원활히 진행되지 않아 마무리가 되지 않아 아쉽다. 회원들의 참여가 많지 않아 모집에 어려움이 있었지만, 교사회원들의 참여로 서로 소통할 기회가 되었다. 이우학교 고1팀, 연구소와 함께 이우학교 고1 새움프로젝트에서 마을안내(2/24-25), 낙생지구 개발 대책에 대해서는 고민을 거의 진행하지 못하였다. 낙생 지구 사업진행 자체도 진행이 더디다. 여전히 위원회 회의 참석자가 적고 운영이 불안정하다. 신입회원으로 공동체가 무엇을 하는 곳인지 여전히 모르겠고 어떻게 결합해야 하는지도 모르겠다. ③진로위 평가- 멘토링(학부모 홍보 및 DB 확보, 개인정보 유출 문제로 학교에서 관리하기로 함), 창업팀(고2 3명, 고1 5명을 대상으로 사다리에서 6강(2시간) 진행, 1/16 창업팀 발표 진행), 시니어 창업팀(21년부터 진로위 회의와 별개로 월 1회씩 만나 아이디어 회의 진행), ④교육위 평가- 독서토론 5회 시힝(활동 방향에 대한 고민의 대안으로 시작, 독서토론 자체는 좋았으나 토론 결과를 공유하지 못해서 아쉬움), 공동체 교사팀과의 연결(두차례의 모임에서 학부모 교육과 생태교육과정에 대한 의미있는 대화를 나눔, 9월 이우의 미래교육 간담회에서 ‘이우학교 미래교육, 무엇이 중요한가’로 토의), 중2 학부모 대화모임 지원(연구소의 제안으로 중2 학부모 중 신청자 18명과 4회 운영, 비폭력대화, 독서토론, 좋은 삶과 좋은 어른을 주제로 대화 나눔) 2) 2022년 결산 및 2023년 예산 승인 3)학교법인 이사 및 감사 추천 4) 공동체 임원(위원장) 선출 △역사편찬 위원회 활동 공유- 22년 4월 29일 1차 회의를 시작으로 매월 정기회의를 진행하여 2023년 2월까지 10차 회의까지 진행, 역사 정리 및 연대표 작성을 위한 과거 문서 수집(772건), 연대표 초안 작성, 주제별 서술 부문의 20개 주제 선정 및 필진 구성, 워크숍 진행(8/28), 주제별 서술 진행 및 초안 검토, “공동체 내부 갈등과 수습” 주제 기술을 위한 1기 회원 인터뷰 2차례 진행, “나와 공동체” 기술을 위한 강연, 향후 일정(주제별 서술 마무리, 연대표 서술 취합 및 정리, “나와 공동체” 서술 진행 및 취합)
