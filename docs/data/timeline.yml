- year: 2012
  month: 3
  day: 9
  event: 공동체 운영위 개최 △학교 10주년 기념사업추진위원회 구성 건(이수광)- 추진위원회는 개교 10주년을 맞아 학교 설립 정신을 되짚어 보고, 미래 미전을 모색할 기회 및 범 이우인이 함께 어울릴 수 있는 화합과 연대의 장의 필요에 의해 구성함. 추진위는 10주년 기념사업 분야 및 규모 예산 등을 결정하는 역할을 담당함. 이사회 2인, 공동체 2인, 학부모회 4인(중,고 각2인), 교사회 2인, 학생회 2인(중,고 각1인), 졸업생 2인 총 16명으로 구성. 사업 결정에 따라 소위원회가 구성될 예정이며, 소위원회에는 <10년사 편찬 소위원회>, <교가제작 소위원회>, <이우대동제 소위원회>, <교육심포지움 소위원회>등이 있음. (의견 수렴 후) 공동체에서는 용수분회 박명규 (부대표)님과 수정분회 박미선 (분회장)님이 추진위원회로 선출됨 △이과수분회- 회원의 날(10주년 기념행사)보고건 대한 분회 별 논의. 1지역 공동체 사업은 찬성이나, 사업의 추진력 등 현재의 공동체 모습에서는 동력이 부족함. 이것을 벗어나기 위하여 외부인원의 공동체 충원은 적극 추진하여야 함. 공동체의 자산에 대해서도 정보를 주었으면 좋겠음. 부채의 경우 미약하나마 현재와 같은 이자의 일정부분을 분담할 수도 있음. 올해 3년 약정이 끝나지만 연장 약정에 참여하겠음. 지역 공동체 사업을 추진할 때 공동체 또는 외부에서 공동체사업에 기부나 급여의 지출은 지속적인 성장이 힘듦. 공동체사업을 추진하는 주체에서 출자를 하고 기업적인 지속방법을 모색하여야 함
  anchor: 2012-03
