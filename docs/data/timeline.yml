  event: 공동체 정기총회 개최 (15:00~17:30, 학습관 대강의실) 박형영 대표의 개회선언 이후 △학교 보고(김철원)- 2015개정 교육과정 적용, 학교 운영의 민주성 회복 필요, 개별적인 학생들의 고유성을 학교가 어떻게 이끌어 나갈 것인가? △의안 심의- 2017년 결산/사업 보고 및 2018년 예산/사업계획 승인, △조직위(장지혜)- 매년 신입회원 모집 예정, 고1을 중심으로 재학생 학부모를 영입, 브런치는 일요일 못 오시는 분을 고려해 토요일로 변경 △지역위(연인선)- 미래직업탐색 1탄으로 김주현 샘 모시고 이우와 지역학부모 대상을 3차례 특강을 하였는데 반응이 매우 좋았음. 성수동 참여까지 마침. 5차례 만나고 모임. 느티나무도서관에서 모임 했는데 도서관측에서 홍보 등의 도움이 많았고 콜렉션도 함께 꾸밈. 소수였지만 의미있는 사업 내용이었음 △진로위(김광범)- 협동조합 사다리의 역량강화에 기여한 면은 평가됨. 평가 모임에서의 의견은 진로위 정체성과 관련해서 아이들의 진로에 대한 고민과 절박함을 어른들이 함께 대신해 줄 수 있는가에 대한 논의가 있었음. 진로위의 정체성과 관련된 내용을 명확히 할 필요도 있음. △교육위 (한승수)- 신임이사교육, 학교홍보 등을 공동체와 같이 해왔음. 올해도 학교철학 등에 대한 검토 지속함. 이우학교의 좀더 장기적인 철학에 대한 고민이 필요함 △학교법인 이사장 신임(한승수), 이사 연임(장지혜) △공동체 임원 조직위 이욱 회원 선출 △모둠별 이야기 마당 1) 공동체 활성화 하기 2) 부채 청산 어떻게 할 것인가?
