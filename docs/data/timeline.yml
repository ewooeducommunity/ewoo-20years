  event: 설문 방식으로 학교평가. 학교 평가의 주된 내용으로는 1) 대안을 논의하기에 앞서 교육의 근본에 대한 깊은 성찰을 할 필요 있음 2) 운동가적 언어와 사고방식이 팽배함. 이를 교육적 언어와 사고방식으로 전환해야 함 3) 이우만의 독자적인 언어가 부재함 4) 교육활동의 전문성을 심화시킬 필요 있음 5) 과거의 유산을 부정의 대상으로 보기보다는 극복의 대상으로 파악해야 함 6) 초동주체와 신입교사들 간 의사소통의 단절 현상이 심각함 등임. 향후 과제로 1) 목표에 도달하는 로드맵의 제시 2) 교사공동체를 튼실하게 꾸리기 3) 정보의 가공 및 처리 과정의 민주화와 전문화 4) 학교가 지닌 문제의 의제화 5) 교사 성장을 위한 프로그램의 기획과 실행 등이 제시됨
