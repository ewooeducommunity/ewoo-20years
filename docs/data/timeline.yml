  event: 7월 이전 광양제철고와 간디학교를 경험한 최영준 교사 초빙. 최영준 교사가 합류하면서 기획 단계의 구상들이 학교의 교육과정과 운영방안으로 구체화되기 시작함. 개교 준비와 새로운 교육과정에 따른 수업을 본격적으로 준비하기 위해 2차 교사 선발. 강상미(음악), 강병욱(수학), 김철원(국어), 노길상(미술), 장미(물리) 등 선발됨.
